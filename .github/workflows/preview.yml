name: Preview deployment

# The Vercel Git integration is intentionally disconnected so that a push to
# master can never publish to production on its own. This workflow restores the
# one thing that disconnect removed: an automatic preview URL for each pull
# request. Production stays manual (`vercel --prod --yes`, see AGENTS.md).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Allows verifying the VERCEL_TOKEN secret from the Actions tab without
  # opening a pull request.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  # One preview per pull request; manual runs get their own group.
  group: preview-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # A hung deploy or an API stall must not wedge the queue for hours.
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_arU5Zgvguo9hoTRIbuGQCpZA
      VERCEL_PROJECT_ID: prj_C8lybVZJOpKl2hQctqTpH8isUBTb
    steps:
      - uses: actions/checkout@v5

      # Forks and repositories without the secret must not fail the workflow.
      - name: Check for Vercel token
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN is not configured; skipping the preview deployment."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        if: steps.token.outputs.present == 'true'
        run: npm install --global vercel@latest

      # An expired or revoked token fails here with a message that says so,
      # instead of surfacing later as a confusing deployment error.
      - name: Validate Vercel token
        if: steps.token.outputs.present == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if ! vercel whoami --token="$VERCEL_TOKEN"; then
            echo "::error::VERCEL_TOKEN is invalid or expired. Create a new token at https://vercel.com/account/tokens and update the repository secret."
            exit 1
          fi

      # Build on Vercel's build machines (no --prebuilt) so the runner does not
      # need the Python runtime or the project's pip dependencies.
      - name: Deploy preview
        if: steps.token.outputs.present == 'true'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Non-interactive runs emit JSON plus a "Preview" line, so pull the
          # first deployment URL out of the output instead of assuming a bare URL.
          out=$(vercel deploy --yes --token="$VERCEL_TOKEN")
          url=$(printf '%s\n' "$out" | grep -oE 'https://[A-Za-z0-9._-]+\.vercel\.app' | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::Could not parse the preview URL from vercel deploy output."
            printf '%s\n' "$out"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview deployment"
            echo ""
            echo "$url"
            echo ""
            echo "This deployment is protected by Vercel Authentication; team members must be signed in to Vercel to open it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview URL on the pull request
        if: steps.token.outputs.present == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            if (!url) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Preview deployment: ${url}\n\nProtected by Vercel Authentication; sign in to Vercel to open it.`,
            });
