name: Data quality

on:
  pull_request:
  push:
    branches: [master]
  # Lets the check be run from the Actions tab when a push event is delayed
  # or wedged in GitHub's queue.
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python validate_data.py
      - run: python -m pytest tests/test_app.py -q
